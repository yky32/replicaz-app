# One-shot: mirror TF signing secrets → yky32/recordo. Delete after success.
name: Mirror secrets → recordo
on:
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror ASC + distribution secrets
        env:
          GH_PAT_FULL: ${{ secrets.GH_PAT_FULL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${GH_PAT_FULL:-}" ]; then
            export GH_TOKEN="$GH_PAT_FULL"
          else
            export GH_TOKEN="${GH_PAT:-}"
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing GH_PAT_FULL / GH_PAT"
            exit 1
          fi
          TARGET=yky32/recordo
          set_secret() {
            local name="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "skip empty $name"
              return 0
            fi
            # long secrets via temp file
            tmp=$(mktemp)
            printf '%s' "$val" > "$tmp"
            gh secret set "$name" --repo "$TARGET" < "$tmp"
            rm -f "$tmp"
            echo "set $name (len=${#val})"
          }
          set_secret APP_STORE_CONNECT_API_KEY_CONTENT "$APP_STORE_CONNECT_API_KEY_CONTENT"
          set_secret APP_STORE_CONNECT_API_KEY_ID "$APP_STORE_CONNECT_API_KEY_ID"
          set_secret APP_STORE_CONNECT_API_KEY_IS_BASE64 "$APP_STORE_CONNECT_API_KEY_IS_BASE64"
          set_secret APP_STORE_CONNECT_ISSUER_ID "$APP_STORE_CONNECT_ISSUER_ID"
          set_secret IOS_DISTRIBUTION_CERT_BASE64 "$IOS_DISTRIBUTION_CERT_BASE64"
          set_secret IOS_DISTRIBUTION_CERT_PASSWORD "$IOS_DISTRIBUTION_CERT_PASSWORD"
          set_secret FASTLANE_USER "$FASTLANE_USER"
          set_secret FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD "$FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD"
          echo "✅ mirrored to $TARGET"
